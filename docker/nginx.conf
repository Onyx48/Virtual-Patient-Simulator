server {
  listen 8080;
  root /usr/share/nginx/html;

  # Hashed build files never change, so browsers can keep them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Any other path is a page of the app: send index.html so a refresh on
  # /scenarios/add does not 404. index.html itself is never cached, so a new
  # deploy is picked up straight away.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
